[project]
name = "liteagent"
version = "0.1.0"
description = "Minimal async agent loop with streaming, steering, and tool execution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Chris Levy" },
]
keywords = ["agent", "llm", "async", "streaming", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "litellm>=1.81.14",
    "pydantic>=2.12.5",
]

[project.urls]
Homepage = "https://github.com/DrChrisLevy/liteagent"
Repository = "https://github.com/DrChrisLevy/liteagent"
Issues = "https://github.com/DrChrisLevy/liteagent/issues"
Author = "https://drchrislevy.com/"

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "jupyter>=1.1.1",
    "notebook>=7.5.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.2",
    "seaborn>=0.13.2",
]

[tool.setuptools]
packages = ["liteagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: real API calls (skip by default, run with -m slow)"]
timeout = 60

[tool.coverage.run]
omit = ["learnings/*"]
