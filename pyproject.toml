[project]
name = "py-pi-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.81.14",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "notebook>=7.5.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.2",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: real API calls (skip by default, run with -m slow)"]
timeout = 60

[tool.coverage.run]
omit = ["learnings/*"]
